[package]
name = "stainless_ffmpeg"
version = "0.6.3"
edition = "2021"
authors = [
  "Marc-Antoine Arnaud <arnaud.marcantoine@gmail.com>",
  "Romane Lafon <romane@nomalab.com>"
]
description = """
Efficient Rust wrapper for FFmpeg.
"""
license = "Apache-2.0"
repository = "https://github.com/nomalab/stainless-ffmpeg"
exclude = ["tests/"]

[dependencies]
ffmpeg-sys-next = "5.0.1"
libc = "0.2.191"
log = "^0.4.35"
serde = "^1.0.229"
serde_derive = "^1.0.229"
serde_json = "^1.0.154"
rand = "0.10.4"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
regex = "1.13.2"

[dev-dependencies]
cpal = "0.18.2"
env_logger = "^0.11.11"
ringbuf = "0.6.0"

[build-dependencies]
ffmpeg-sys-next = "5.0.1"
